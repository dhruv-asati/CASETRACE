spring.config.import=optional:file:.env[.properties]

spring.application.name=casetrace-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:casetrace}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema and sample data are managed with the SQL scripts in ../database.
spring.sql.init.mode=never
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never

# Session-backed investigator authentication. Enable Secure cookies behind HTTPS.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
casetrace.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
